<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin · Tariff Advisor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="admin-body">
<header class="admin-header">
  <div class="admin-brand">
    <span class="brand-mark small" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22"><path d="M6 4 L18 4 L14 12 L24 8 L16 16 L26 18 L14 20 L20 28 L10 22 L6 30 L8 18 Z" fill="currentColor"/></svg>
    </span>
    <strong>Tariff Advisor</strong>
    <span class="pill pill-admin">{{ tr('auth.admin') }}</span>
  </div>
  <nav class="admin-nav" aria-label="{{ tr('auth.admin') }}">
    <a href="{{ url_for('admin.dashboard') }}" class="{% if active_admin_nav == 'dashboard' %}is-active{% endif %}">{{ tr('admin.nav_dashboard') }}</a>
    <a href="{{ url_for('admin.customers') }}" class="{% if active_admin_nav == 'customers' %}is-active{% endif %}">{{ tr('admin.nav_customers') }}</a>
    <span class="lang-bar inline" aria-label="{{ tr('lang.aria') }}">
      <a href="{{ url_for('auth.set_lang', code='az', next=(request.full_path if request.query_string else request.path)) }}"
         class="lang-opt {% if locale == 'az' %}is-on{% endif %}" hreflang="az">AZ</a>
      <span aria-hidden="true">/</span>
      <a href="{{ url_for('auth.set_lang', code='en', next=(request.full_path if request.query_string else request.path)) }}"
         class="lang-opt {% if locale == 'en' %}is-on{% endif %}" hreflang="en">EN</a>
    </span>
    <form action="{{ url_for('auth.logout') }}" method="post" class="inline-form">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button type="submit" class="link-btn">{{ tr('admin.signout') }}</button>
    </form>
  </nav>
</header>

{% if demo_mode %}
<p class="demo-strip" role="note">{{ tr('demo.strip_admin') }}</p>
{% endif %}

<main class="admin-main" id="main">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
